<html>
    <head><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.css">
        <script src="https://code.iconify.design/2/2.2.1/iconify.min.js"></script>
        
        <!-- Fonts & Icons -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
        
        <link rel="stylesheet" href="index.css">
    </head>
    <body class="contact-page">
        <main id="main">
            <!-- Form section -->
            <section class="contact-form-section">
                <form aria-describedby="form-instructions">
                    <h1 class="contact-form-heading">Reach <span>Out</span></h1>
                    <p class="contact-form-intro" id="form-instructions">Curious about something? Complete these fields and "get in touch", as you humans say. 🤙</p>
                    <label for="name">Name</label>
                    <input class="contact-input" id="name" type="text" placeholder="Full name" />
                    <label for="email">Email</label>
                    <input class="contact-input" id="email" type="email" placeholder="Email" />
                    <label for="message">Message</label>
                    <textarea class="contact-textarea" id="message" rows="4" cols="50" placeholder="Your message..."></textarea>
                    <button class="contact-submit-button" type="submit" onclick="submitForm()">Submit message</button>
                </form>
                <img class="contact-image" src="images/connect.jpg" alt="A Human hand reaching toward a white robotic hand" />
            </section>
        </main>
    </body>
</html>
